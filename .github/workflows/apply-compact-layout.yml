name: Adjust top toolbar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compact-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Share e restaura menu de tema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("streamlit_app.py")
          text = path.read_text(encoding="utf-8")

          old = '[data-testid="stDecoration"],#MainMenu,footer{display:none!important}'
          new = '''[data-testid="stDecoration"],footer{display:none!important}
#MainMenu,
span[data-testid="stMainMenu"]{
  display:flex!important;
  visibility:visible!important;
  pointer-events:auto!important;
}
span[data-testid="stMainMenu"] button{
  color:var(--ink)!important;
}
span[data-testid="stMainMenu"] svg{
  fill:var(--ink)!important;
  color:var(--ink)!important;
}
/* Remove somente o botão Share do toolbar do Community Cloud */
[data-testid="stToolbarActions"] > [data-testid="stToolbarActionButton"]:first-child,
.stToolbarActions > .stToolbarActionButton:first-child{
  display:none!important;
}'''

          if old in text:
              text = text.replace(old, new, 1)
          elif 'Remove somente o botão Share do toolbar do Community Cloud' not in text:
              raise SystemExit("Trecho do toolbar não encontrado para atualização")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Valida sintaxe Python
        run: python -m py_compile streamlit_app.py

      - name: Commit do menu superior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m "Remove Share e restaura menu de aparência"
          git push
