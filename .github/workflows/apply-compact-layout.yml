name: Apply compact responsive layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compact-layout.yml'

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reduz altura do banner principal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          old = 'min-height:clamp(240px,30vh,310px);'
          if text.count(old) < 2:
              raise SystemExit('Altura atual do banner não encontrada; nenhuma alteração realizada.')

          # O banner e a imagem passam a ocupar menos altura, preservando o recorte com background-size: cover.
          text = text.replace(old, 'min-height:clamp(205px,24vh,255px);', 2)

          # Em notebooks/monitores com menor altura útil, compacta ainda mais o banner.
          text = text.replace('.hero{min-height:230px}', '.hero{min-height:205px}', 1)
          text = text.replace('.hero-image{min-height:230px}', '.hero-image{min-height:205px}', 1)
          text = text.replace('.hero-copy{padding-top:32px;padding-bottom:24px}', '.hero-copy{padding-top:26px;padding-bottom:20px}', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit da adequação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m "Reduz altura do banner principal para evitar rolagem vertical"
          git push
