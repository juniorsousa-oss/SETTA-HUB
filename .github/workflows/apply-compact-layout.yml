name: Add three app cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compact-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adiciona três novos cartões configuráveis
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("streamlit_app.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''        {"nome": "Gestão de Equipe", "descricao": "Colaboradores e plano de carreira", "icone": "👥", "icone_png": "", "status": "Online", "url": "#"},
    ],
}'''

          replacement = '''        {"nome": "Gestão de Equipe", "descricao": "Colaboradores e plano de carreira", "icone": "👥", "icone_png": "", "status": "Online", "url": "#"},
        {"nome": "Novo Aplicativo 7", "descricao": "Espaço disponível para novo aplicativo", "icone": "➕", "icone_png": "", "status": "Disponível", "url": "#"},
        {"nome": "Novo Aplicativo 8", "descricao": "Espaço disponível para novo aplicativo", "icone": "➕", "icone_png": "", "status": "Disponível", "url": "#"},
        {"nome": "Novo Aplicativo 9", "descricao": "Espaço disponível para novo aplicativo", "icone": "➕", "icone_png": "", "status": "Disponível", "url": "#"},
    ],
}'''

          if '"Novo Aplicativo 7"' not in text:
              if anchor not in text:
                  raise SystemExit("Lista padrão de aplicativos não encontrada")
              text = text.replace(anchor, replacement, 1)

          merge_anchor = '''            app.setdefault("url", "#")
            cfg["apps"].append(app)
    return cfg'''

          merge_replacement = '''            app.setdefault("url", "#")
            cfg["apps"].append(app)

        # Mantém os cartões já salvos e completa automaticamente até o total padrão.
        while len(cfg["apps"]) < len(DEFAULT_CONFIG["apps"]):
            idx = len(cfg["apps"])
            cfg["apps"].append(copy.deepcopy(DEFAULT_CONFIG["apps"][idx]))
    return cfg'''

          if 'while len(cfg["apps"]) < len(DEFAULT_CONFIG["apps"])' not in text:
              if merge_anchor not in text:
                  raise SystemExit("Função merge_config não encontrada")
              text = text.replace(merge_anchor, merge_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Valida sintaxe Python
        run: python -m py_compile streamlit_app.py

      - name: Commit dos novos cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m "Adiciona três novos cartões configuráveis"
          git push
