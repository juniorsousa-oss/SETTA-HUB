name: Fix responsive user avatar and manage button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compact-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrige avatar responsivo e botão Gerenciar aplicativo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          old_user = '''.user{position:absolute;top:50%;right:220px;transform:translateY(-50%);color:var(--ink);font-size:clamp(13px,.85vw,15px);font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap}
          .user-badge{position:relative;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid rgba(30,35,46,.16);box-shadow:0 2px 8px rgba(20,35,58,.08);flex:0 0 32px}
          .user-badge:before{content:"";position:absolute;top:7px;left:50%;width:8px;height:8px;transform:translateX(-50%);border-radius:50%;background:#23324A}
          .user-badge:after{content:"";position:absolute;left:50%;bottom:6px;width:15px;height:8px;transform:translateX(-50%);border-radius:9px 9px 5px 5px;background:#23324A}
          .user-chevron{font-size:14px;margin-left:1px}'''

          new_user = '''.user{position:absolute;top:50%;right:clamp(175px,12vw,230px);transform:translateY(-50%);color:var(--ink);font-size:clamp(13px,.85vw,15px);font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap;line-height:1}
          .user-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(30,35,46,.16);box-shadow:0 2px 8px rgba(20,35,58,.08);flex:0 0 32px;overflow:hidden}
          .user-badge svg{display:block;width:18px;height:18px;min-width:18px;min-height:18px;fill:#23324A;stroke:none}
          .user-chevron{font-size:14px;line-height:1;margin-left:1px;flex:0 0 auto}

          /* Botão nativo do Streamlit Community Cloud: Gerenciar aplicativo */
          [data-testid="manage_app_button"],
          button[data-testid="manage_app_button"],
          [class*="viewerBadge"] button,
          [class*="viewerBadge"] a{
            background:var(--y)!important;
            color:var(--ink)!important;
            border-color:#DFA817!important;
            box-shadow:0 4px 12px rgba(31,45,73,.12)!important;
          }
          [data-testid="manage_app_button"] *,
          button[data-testid="manage_app_button"] *,
          [class*="viewerBadge"] button *,
          [class*="viewerBadge"] a *{
            color:var(--ink)!important;
            fill:var(--ink)!important;
            stroke:var(--ink)!important;
          }'''

          if old_user in text:
              text = text.replace(old_user, new_user, 1)
          elif 'user-badge svg' not in text:
              raise SystemExit('Bloco CSS do usuário não encontrado')

          old_markup = 'f\'<div class="user"><div class="user-badge"></div><span>{esc(cfg["usuario"])}</span><span class="user-chevron">⌄</span></div></div>\''
          new_markup = 'f\'<div class="user"><div class="user-badge"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20c.45-4.05 3.18-6.2 7.5-6.2s7.05 2.15 7.5 6.2H4.5z"></path></svg></div><span>{esc(cfg["usuario"])}</span><span class="user-chevron">⌄</span></div></div>\''

          if old_markup in text:
              text = text.replace(old_markup, new_markup, 1)
          elif '<svg viewBox="0 0 24 24"' not in text:
              raise SystemExit('Markup do avatar não encontrado')

          text = text.replace(
              '.user-badge{width:28px;height:28px}\n  .user{font-size:12px}',
              '.user-badge{width:30px;height:30px;flex-basis:30px}\n  .user-badge svg{width:17px;height:17px;min-width:17px;min-height:17px}\n  .user{font-size:12px}',
              1,
          )

          text = text.replace(
              '@media (max-width:1320px){\n  :root{--page-pad:clamp(20px,3vw,42px)}\n  .user{right:175px}',
              '@media (max-width:1320px){\n  :root{--page-pad:clamp(20px,3vw,42px)}\n  .user{right:165px}',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Valida sintaxe Python
        run: python -m py_compile streamlit_app.py

      - name: Commit das correções visuais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m "Corrige avatar responsivo e estiliza botão de gerenciamento"
          git push
