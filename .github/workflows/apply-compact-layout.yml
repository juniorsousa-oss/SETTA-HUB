name: Refine SETTA HUB admin login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compact-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplica layout institucional na tela de senha
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Valida sintaxe Python
        run: python -m py_compile streamlit_app.py
      - name: Commit da melhoria visual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git diff --cached --quiet || git commit -m "Refina layout da tela de senha administrativa"
          git push
